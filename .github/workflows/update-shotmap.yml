name: Update shot map data
on:
  schedule:
    - cron: "17 9,15 * * *"   # 11:17 and 17:17 Vienna summer time
  workflow_dispatch:
permissions:
  contents: write
concurrency: shotmap-data
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python fetch.py
        working-directory: shotmap
        env: { MAX_MINUTES: "300" }
      - run: |
          git config user.name "shot-map-bot"
          git config user.email "actions@users.noreply.github.com"
          git add shotmap/data
          git diff --cached --quiet && exit 0
          git commit -q -m "Update shot data"
          git pull --rebase -q && git push
