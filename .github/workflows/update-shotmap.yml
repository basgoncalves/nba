name: Update shot map data
on:
  schedule:
    - cron: "17 9,15 * * *"   # twice a day, after games finish (UTC)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python fetch.py
        working-directory: shotmap
      - run: |
          git config user.name "shot-map-bot"
          git config user.email "actions@users.noreply.github.com"
          git add shotmap/data
          git diff --cached --quiet || (git commit -m "Update shot data" && git push)
